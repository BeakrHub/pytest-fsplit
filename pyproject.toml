[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pytest-fsplit"
version = "0.1.0"
description = "File-level pytest sharding based on historical test durations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pytest>=7",
]

[project.entry-points.pytest11]
pytest-fsplit = "pytest_fsplit.plugin"

[project.scripts]
fsplit-plan = "pytest_fsplit.cli:show_plan"
fsplit-slowest-tests = "pytest_fsplit.cli:list_slowest_tests"
fsplit-slowest-files = "pytest_fsplit.cli:list_slowest_files"
slowest-tests = "pytest_fsplit.cli:list_slowest_tests"

[project.optional-dependencies]
dev = [
  "pytest-xdist>=3",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]
