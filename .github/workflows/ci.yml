name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        if: matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Build package
        if: matrix.python-version == '3.13'
        run: uv build

      - name: Smoke test built wheel
        if: matrix.python-version == '3.13'
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          .venv/bin/python -c "import subprocess; out = subprocess.check_output(['.venv/bin/pytest', '--help'], text=True); assert '--fsplits' in out; assert '--fgroup' in out"
          .venv/bin/fsplit-slowest-tests --help
          .venv/bin/fsplit-slowest-files --help
