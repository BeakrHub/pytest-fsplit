name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        if: matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Build package
        if: matrix.python-version == '3.13'
        run: uv build

      - name: Smoke test built wheel
        if: matrix.python-version == '3.13'
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          .venv/bin/python -c "import subprocess; out = subprocess.check_output(['.venv/bin/pytest', '--help'], text=True); assert '--fsplits' in out; assert '--fgroup' in out"
          .venv/bin/fsplit-plan --help
          .venv/bin/fsplit-slowest-tests --help
          .venv/bin/fsplit-slowest-files --help
          .venv/bin/python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          pytest_bin = Path.cwd() / ".venv/bin/pytest"
          with tempfile.TemporaryDirectory() as workspace:
              root = Path(workspace)
              tests = root / "tests"
              tests.mkdir()
              (tests / "test_slow.py").write_text("def test_slow():\n    pass\n")
              (tests / "test_fast.py").write_text("def test_fast():\n    pass\n")
              (root / ".test_durations").write_text(
                  json.dumps(
                      {
                          "tests/test_slow.py::test_slow": 10.0,
                          "tests/test_fast.py::test_fast": 1.0,
                      }
                  )
              )
              output = subprocess.check_output(
                  [
                      str(pytest_bin),
                      "--collect-only",
                      "-q",
                      "--splits",
                      "2",
                      "--group",
                      "1",
                  ],
                  cwd=root,
                  text=True,
              )
              assert "tests/test_slow.py::test_slow" in output
              assert "tests/test_fast.py::test_fast" not in output
          PY

  pytest-compatibility:
    name: pytest ${{ matrix.pytest-version }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pytest-version: ">=7,<8"
          - python-version: "3.12"
            pytest-version: ">=8,<9"
          - python-version: "3.13"
            pytest-version: ">=9,<10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          uv pip install "pytest${{ matrix.pytest-version }}" "pytest-xdist>=3"

      - name: Show pytest version
        run: .venv/bin/pytest --version

      - name: Test
        run: .venv/bin/pytest -q
